<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found | Sharad Shinde</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%2305070d"/><text x="32" y="44" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="36" font-weight="700" fill="%23fca311">S</text></svg>' type="image/svg+xml" />
    <style>
      :root {
        --bg: #05070d;
        --text: #f1f5f9;
        --muted: #98a4b5;
        --accent: #fca311;
      }
      @media (prefers-color-scheme: light) {
        :root { --bg: #fafaf8; --text: #16181d; --muted: #40485a; --accent: #b26e00; }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .code { font-size: 5rem; font-weight: 700; color: var(--accent); line-height: 1; }
      p { color: var(--muted); max-width: 40ch; }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The resume lives at the root — <a href="/">cv.shrd.in</a> — or grab the <a href="/Resume.pdf">PDF</a> directly.</p>
  </body>
</html>
